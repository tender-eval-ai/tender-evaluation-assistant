# Ingress sidecar for the Cloud Run service: one host, two upstreams.
#   /api/*  -> backend (FastAPI, :8000)   — the UI's browser-direct uploads and
#                                           evidence links use PUBLIC_BACKEND_URL=/api
#   /*      -> frontend (Streamlit, :8501) — websocket upgrade passed through
# All three containers share the instance's network namespace (localhost).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    client_max_body_size 512m;        # folder uploads: many PDFs in one request

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
    }

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 86400s;    # Streamlit keeps a long-lived websocket
    }
}
