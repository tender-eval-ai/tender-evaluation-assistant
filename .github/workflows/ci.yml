name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pre-commit
      # ruff, gitleaks (staged), large files, merge markers, private keys, PDF placement.
      - run: pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements.lock
      # The default suite is fully offline: no LLM calls, no tokens, no client data.
      - run: python -m pytest test/ -q

  integration:
    # The Postgres-backed tests: the check API, the worker, migrations. The harness
    # scenarios (-m orchestrator) stay a local, opt-in run.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: harness
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:dev@localhost:55432/harness
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements.lock
      - run: python -m pytest -m postgres -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Runs on the MSW mock of the S2 contract: no backend, no secrets.
      - run: npx vitest run
      - run: npm run build

  e2e:
    # The review flow in a real browser, on the MSW mock: no backend, no secrets,
    # the same conditions as the Vitest suite. A separate job because it needs a dev
    # server and a browser download, which would slow the fast `web` job on every PR.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/test-results/
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks over the full history
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: pip-audit over the lockfile
        run: |
          pip install pip-audit
          pip-audit -r requirements.lock --require-hashes

  main-guard:
    # Branch protection is not available on this private repo. This job cannot stop a
    # direct push to main, but it makes one visible: it fails when the pushed commit is
    # not associated with a merged pull request.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: fail unless this commit came through a merged pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub links a merge commit to its pull request a few seconds after the merge;
          # a query 6 s after merging #2 saw nothing. Ask up to six times, 10 s apart.
          for attempt in 1 2 3 4 5 6; do
            n=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
                  --jq '[.[] | select(.merged_at != null)] | length')
            if [ "$n" != "0" ]; then
              echo "commit ${{ github.sha }} came through a merged pull request (attempt $attempt)"
              exit 0
            fi
            sleep 10
          done
          echo "::error::commit ${{ github.sha }} reached main without a merged pull request"
          exit 1
