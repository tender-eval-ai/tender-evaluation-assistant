name: deploy-azure

# The shared demo on Azure (deploy/azure/, checklist G4). Run by hand from the Actions
# tab: it builds the backend and web images, pushes them to the GitHub Container
# Registry, and deploys that commit. A pull request that touches the deploy files only
# compiles the Bicep and checks the scripts parse; nothing reaches Azure.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "deploy/azure/**"
      - ".github/workflows/deploy-azure.yml"

permissions:
  contents: read

concurrency:
  group: deploy-azure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: az bicep build --file deploy/azure/main.bicep --stdout > /dev/null
      - run: for f in deploy/azure/*.sh; do bash -n "$f"; done

  images:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: web
          push: true
          tags: ghcr.io/${{ github.repository }}/web:${{ github.sha }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    # The Entra app registration trusts this environment only (setup.sh): no stored secret.
    environment: azure-demo
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906  # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: bash deploy/azure/deploy.sh "${{ github.sha }}"
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_NAME_SUFFIX: ${{ vars.AZURE_NAME_SUFFIX }}
          AZURE_PREFIX: ${{ vars.AZURE_PREFIX }}
          AZURE_GHCR_USER: ${{ vars.AZURE_GHCR_USER }}
          AZURE_SIGNIN_CLIENT_ID: ${{ vars.AZURE_SIGNIN_CLIENT_ID }}
          AZURE_OPENAI_LOCATION: ${{ vars.AZURE_OPENAI_LOCATION }}
          AZURE_OPENAI_MODEL: ${{ vars.AZURE_OPENAI_MODEL }}
          AZURE_OPENAI_MODEL_VERSION: ${{ vars.AZURE_OPENAI_MODEL_VERSION }}
          AZURE_CUSTOM_DOMAIN: ${{ vars.AZURE_CUSTOM_DOMAIN }}
