name: deploy-azure

# The shared demo on Azure (deploy/azure/, checklist G4). Run by hand from the Actions
# tab: it builds the backend and web images, pushes them to the GitHub Container
# Registry, and deploys that commit. A pull request that touches the deploy files only
# compiles the Bicep and checks the scripts parse; nothing reaches Azure.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "deploy/azure/**"
      - ".github/workflows/deploy-azure.yml"

permissions:
  contents: read

concurrency:
  group: deploy-azure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: az bicep build --file deploy/azure/main.bicep --stdout > /dev/null
      - run: for f in deploy/azure/*.sh; do bash -n "$f"; done

  images:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          tags: ghcr.io/${{ github.repository }}/web:${{ github.sha }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    # The Entra app registration trusts this environment only (setup.sh): no stored secret.
    environment: azure-demo
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: bash deploy/azure/deploy.sh "${{ github.sha }}"
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_NAME_SUFFIX: ${{ vars.AZURE_NAME_SUFFIX }}
          AZURE_PREFIX: ${{ vars.AZURE_PREFIX }}
          AZURE_GHCR_USER: ${{ vars.AZURE_GHCR_USER }}
          AZURE_SIGNIN_CLIENT_ID: ${{ vars.AZURE_SIGNIN_CLIENT_ID }}
